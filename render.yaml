services:
  - type: web
    name: store-rating-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    # Seed is idempotent: it creates demo data only when the database is empty,
    # then starts the API. This avoids requiring a paid Render Shell session.
    startCommand: npm run seed && npm start
    healthCheckPath: /health
    envVars:
      # node:sqlite and the test runner need Node >= 22.5
      - key: NODE_VERSION
        value: 22.11.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: store-rating-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 24h
      - key: COOKIE_MAX_AGE
        value: "86400000"
      - key: BCRYPT_SALT_ROUNDS
        value: "10"
      # Production frontend origin; also used by the API's origin check.
      - key: CORS_ORIGIN
        value: https://frontend-jet-omega-owz6ey1l8l.vercel.app

databases:
  - name: store-rating-db
    plan: free
    databaseName: ratings
    user: ratings
